[workspace]
resolver = "3"
members = [
  ".",
  "crates/nsh-music-core",
  "crates/nsh-music-audio",
  "crates/nsh-music-plugin",
  "crates/nsh-web-signin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
nsh-core = { version = "0.7" }
nsh-base = { version = "0.7", default-features = false }
nsh-engine = { version = "0.7", default-features = false }
nsh-testing = { version = "0.7", default-features = false }
nsh-platform-macos = { version = "0.7", default-features = false, features = ["shader", "svg"] }
nsh-platform-linux = { version = "0.7", default-features = false, features = [
  "shader",
  "svg",
  "net",
  "sound",
] }
nsh-platform-windows = { version = "0.7", default-features = false, features = [
  "shader",
  "svg",
  "net",
] }

nsh-music-core = { path = "crates/nsh-music-core" }
nsh-music-audio = { path = "crates/nsh-music-audio" }
nsh-music-plugin = { path = "crates/nsh-music-plugin" }
nsh-web-signin = { path = "crates/nsh-web-signin" }

ffmpeg-sys-next = { git = "https://github.com/richerfu/rust-ffmpeg-sys", default-features = false, features = [
  "avcodec",
  "avformat",
  "swresample",
  "static",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
  "net",
  "io-util",
  "process",
  "macros",
] }
thiserror = "2"
anyhow = "1"
url = "2.5"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
aes = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
quickjs-jit = { version = "=0.14.2", default-features = false, features = [
  "std",
  "futures",
  "loader",
  "macro",
] }
oxc = { version = "=0.153.0", features = ["transformer", "codegen", "semantic"] }
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }
opus-pure = "0.2.5"
cpal = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
  "system-proxy",
  "http2",
  "gzip",
  "deflate",
  "brotli",
  "charset",
  "stream",
  "json",
] }
ohos-audio-binding = { version = "0.1", default-features = false, features = ["api-20"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[package]
name = "nsh-app-music"
description = "Cross-platform native music player built on Native Shell (NSH) with plugin compatibility and embedded FFmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "nsh_app_music"
path = "src/lib.rs"

[[bin]]
name = "nsh-music"
path = "src/main.rs"

[dependencies]
nsh-core = { workspace = true, features = ["shader", "svg", "loader"] }
nsh-base.workspace = true
nsh-music-core.workspace = true
nsh-music-audio.workspace = true
nsh-music-plugin.workspace = true
nsh-web-signin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
qrcode.workspace = true
dirs.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[target.'cfg(target_env = "ohos")'.dependencies]
nsh-platform-harmonyos = { path = "../nsh-platform-harmonyos.worktrees/upgrade-nsh-0.7", default-features = false }

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing = { workspace = true, features = ["live"] }

[package.metadata.nsh.harmonyos]
querySchemes = ["https", "http"]

[[package.metadata.nsh.harmonyos.permissions]]
name = "ohos.permission.INTERNET"
reason = "Stream music, fetch album artwork, and run music plugins."
when = "inuse"

[[package.metadata.nsh.harmonyos.permissions]]
name = "ohos.permission.KEEP_BACKGROUND_RUNNING"
reason = "Continue audio playback when the app moves to the background."
when = "always"

[profile.dev.package."*"]
debug = 0
opt-level = 2
