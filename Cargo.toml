[workspace]
resolver = "3"
members = [
  ".",
  "crates/nsh-music-core",
  "crates/nsh-music-audio",
  "crates/nsh-music-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
nsh-core = { path = "../nsh/crates/nsh-core" }
nsh-base = { path = "../nsh/crates/nsh-base", default-features = false }
nsh-engine = { path = "../nsh/crates/nsh-engine", default-features = false }
nsh-testing = { path = "../nsh/crates/nsh-testing", default-features = false }
nsh-platform-macos = { path = "../nsh/crates/nsh-platform-macos", default-features = false, features = ["shader", "svg"] }
nsh-platform-linux = { path = "../nsh/crates/nsh-platform-linux", default-features = false, features = ["shader", "svg", "net", "sound"] }
nsh-platform-windows = { path = "../nsh/crates/nsh-platform-windows", default-features = false, features = ["shader", "svg", "net"] }

nsh-music-core = { path = "crates/nsh-music-core" }
nsh-music-audio = { path = "crates/nsh-music-audio" }
nsh-music-plugin = { path = "crates/nsh-music-plugin" }

ffmpeg-sys-next = { path = "../rust-ffmpeg-sys", default-features = false, features = ["avcodec", "avformat", "swresample", "static"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "macros"] }
thiserror = "2"
anyhow = "1"
url = "2.5"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
aes = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
quickjs-jit = { version = "=0.14.2", default-features = false, features = ["std", "futures", "loader", "macro"] }
oxc = { version = "=0.153.0", features = ["transformer", "codegen", "semantic"] }
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "system-proxy", "http2", "gzip", "deflate", "brotli", "charset", "stream", "json"] }
ohos-audio-binding = { version = "0.1", default-features = false, features = ["api-20"] }
dirs = "6"

[package]
name = "nsh-app-music"
description = "Cross-platform native music player built on Native Shell (NSH) with plugin compatibility and embedded FFmpeg."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "nsh_app_music"
path = "src/lib.rs"

[[bin]]
name = "nsh-music"
path = "src/main.rs"

[dependencies]
nsh-core = { workspace = true, features = ["shader", "svg", "loader"] }
nsh-base.workspace = true
nsh-music-core.workspace = true
nsh-music-audio.workspace = true
nsh-music-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
sha2.workspace = true
reqwest.workspace = true
url.workspace = true
qrcode.workspace = true
dirs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

[dev-dependencies]
nsh-engine.workspace = true
nsh-testing = { workspace = true, features = ["live"] }

[package.metadata.nsh.harmonyos]
querySchemes = ["https", "http"]

[[package.metadata.nsh.harmonyos.permissions]]
name = "ohos.permission.INTERNET"
reason = "Stream music, fetch album artwork, and run music plugins."
when = "inuse"

[[package.metadata.nsh.harmonyos.permissions]]
name = "ohos.permission.KEEP_BACKGROUND_RUNNING"
reason = "Continue audio playback when the app moves to the background."
when = "always"

[profile.dev.package."*"]
debug = 0
