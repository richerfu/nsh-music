[package]
name = "nsh-music-audio"
description = "Cross-platform audio engine with progressive LRU disk cache, ReplayGain/fade/FFT DSP, Symphonia + optional static audio-only FFmpeg, cpal/OHOS output, and virtual FFmpeg shim."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio-symphonia"]
audio-symphonia = ["dep:symphonia", "dep:opus-pure"]
audio-ffmpeg = ["dep:ffmpeg-sys-next"]

[dependencies]
nsh-music-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
log.workspace = true
sha2.workspace = true
hex.workspace = true
dirs.workspace = true

symphonia = { workspace = true, optional = true }
opus-pure = { workspace = true, optional = true }
ffmpeg-sys-next = { workspace = true, optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_env = "ohos")))'.dependencies]
cpal.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSValue", "NSDictionary", "NSObject", "NSNotification", "NSOperation"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com"] }
windows-core = "0.62"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[target.'cfg(target_env = "ohos")'.dependencies]
ohos-audio-binding.workspace = true
