    function renderVisualCenterpiece(tr, sizeHint = "lg") {
      const style = state.npPlayerStyle;
      if (style === "vinyl") {
        return `
          <div class="vinyl-stage" style="${sizeHint === "sm" ? "width:248px" : ""}">
            <div class="vinyl-platter ${state.playing ? "playing" : ""}">
              <div class="vinyl-grooves"></div>
              <div class="vinyl-label">
                <img src="${tr.cover}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
              </div>
              <div class="vinyl-spindle"></div>
            </div>
            <svg class="tonearm ${state.playing ? "playing" : ""}" viewBox="0 0 100 180">
              <circle cx="72" cy="24" r="14" fill="#d4d4d8" stroke="#52525b" stroke-width="3"/>
              <path d="M72 24 L56 128 L42 152" fill="none" stroke="#e4e4e7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="34" y="146" width="14" height="22" rx="3" fill="#27272a" transform="rotate(24 41 157)"/>
            </svg>
          </div>
        `;
      }
      if (style === "cassette") {
        const progress = Math.min(1, Math.max(0, state.positionSec / tr.duration));
        const leftThickness = 4 + (1 - progress) * 8;
        const rightThickness = 4 + progress * 8;
        return `
          <div class="cassette-stage" style="${sizeHint === "sm" ? "width:280px" : ""}">
            <div style="display:flex;justify-content:space-between;opacity:0.45;font-size:10px;font-family:var(--font-mono)">
              <span>● SIDE A</span><span>HIGH BIAS · ${tr.quality}</span><span>●</span>
            </div>
            <div class="cassette-label">
              <div style="display:flex;align-items:center;gap:10px">
                <img src="${tr.cover}" alt="" style="width:36px;height:36px;border-radius:6px;object-fit:cover"/>
                <div style="min-width:0;flex:1">
                  <div class="truncate" style="font-weight:800;font-size:13.5px;color:#111">${tr.name}</div>
                  <div class="truncate" style="font-size:11.5px;color:#555">${tr.artist} — ${tr.album}</div>
                </div>
              </div>
              <div class="cassette-window">
                <div style="position:absolute;left:36px;right:36px;height:2px;background:rgba(255,255,255,0.22);bottom:12px"></div>
                <div class="reel ${state.playing ? "playing" : ""}" style="box-shadow:0 0 0 ${leftThickness}px rgba(255,255,255,0.14)"></div>
                <span class="tabular" style="font-size:11px;font-family:var(--font-mono);color:rgba(255,255,255,0.72)">${fmtTime(state.positionSec)}</span>
                <div class="reel ${state.playing ? "playing" : ""}" style="box-shadow:0 0 0 ${rightThickness}px rgba(255,255,255,0.14)"></div>
              </div>
            </div>
            <div style="height:18px;background:#101014;border-radius:6px;margin:0 24px;display:flex;align-items:center;justify-content:space-around">
              <span style="width:8px;height:8px;border-radius:99px;background:#3f3f46"></span>
              <span style="width:24px;height:6px;border-radius:2px;background:#27272a"></span>
              <span style="width:8px;height:8px;border-radius:99px;background:#3f3f46"></span>
            </div>
          </div>
        `;
      }
      return `
        <div class="np-cover-box ${state.playing ? "" : "paused"}" style="${sizeHint === "sm" ? "width:248px" : ""}">
          <img src="${tr.cover}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
        </div>
      `;
    }

    function renderLyricsBody(tr) {
      const idx = activeLyricIndex(tr, state.positionSec);
      return `<div class="lyrics-scroll" id="np-lyrics-scroll">
        ${tr.lyrics.map((line, i) => {
          const isActive = i === idx;
          const lineDur = Math.max(1, line.end - line.start);
          const frac = isActive ? Math.min(1, Math.max(0, (state.positionSec - line.start) / lineDur)) : (i < idx ? 1 : 0);
          const words = line.words || [line.text];
          const sungCount = Math.ceil(frac * words.length);
          const wordsHtml = words.map((w, wi) => `<span class="lyric-word ${wi < sungCount ? "sung" : ""}">${w}</span>`).join("");
          return `
            <button class="lyric-line ${isActive ? "active" : ""}" data-action="seek-sec" data-sec="${line.start}">
              <div class="lyric-main">${wordsHtml}</div>
              ${line.trans ? `<div class="lyric-trans">${line.trans}</div>` : ""}
            </button>
          `;
        }).join("")}
      </div>`;
    }

    function renderNowPlayingOverlay(opts = {}) {
      const tr = currentTrack();
      const closeAction = opts.closeAction || "close-np";
      const isPhone = !!opts.isPhone;
      const idx = activeLyricIndex(tr, state.positionSec);
      const curLine = tr.lyrics[idx] || tr.lyrics[0];
      const pct = Math.min(100, Math.max(0, (state.positionSec / tr.duration) * 100));
      const liked = state.likedIds.has(tr.id);

      let rightPaneHtml = "";
      if (state.npPane === "lyrics") {
        rightPaneHtml = renderLyricsBody(tr);
      } else if (state.npPane === "queue") {
        rightPaneHtml = `
          <div style="height:100%;max-height:480px;overflow-y:auto;padding-right:6px">
            <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--np-muted)">接下来播放 (${TRACKS.length} 首)</div>
            ${TRACKS.map((qtr, qi) => `
              <button class="track-row ${qtr.id === tr.id ? "active" : ""}" data-action="play-track" data-idx="${qi}" style="width:100%;color:#fff;${qtr.id === tr.id ? "background:rgba(255,255,255,0.14)" : ""}">
                <span class="track-idx tabular" style="color:var(--np-muted)">${qi + 1}</span>
                <div class="track-art"><img src="${qtr.cover}" style="width:100%;height:100%;object-fit:cover"/></div>
                <div class="track-meta">
                  <div class="track-title truncate" style="${qtr.id === tr.id ? `color:${tr.accent}` : "color:#fff"}">${qtr.name}</div>
                  <div class="track-sub truncate" style="color:var(--np-muted)">${qtr.artist}</div>
                </div>
                <span class="tabular" style="font-size:12px;color:var(--np-muted)">${fmtTime(qtr.duration)}</span>
              </button>
            `).join("")}
          </div>
        `;
      } else if (state.npPane === "comments") {
        rightPaneHtml = `
          <div style="height:100%;max-height:480px;overflow-y:auto;display:flex;flex-direction:column;gap:12px">
            <div style="font-size:14px;font-weight:700;color:var(--np-muted)">热门评论 (${tr.comments.length})</div>
            ${tr.comments.map(cm => `
              <div style="padding:14px;border-radius:14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.10)">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12.5px">
                  <strong>${cm.author} <span style="font-weight:400;color:var(--np-muted)">· ${cm.time}</span></strong>
                  <span style="color:${cm.liked ? tr.accent : "var(--np-muted)"}">♥ ${cm.likes}</span>
                </div>
                <div style="font-size:13.5px;line-height:1.5;color:rgba(255,255,255,0.90)">${cm.text}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      // Full-bleed stages (Flow / Steps / Tilt / Wall)
      const isFullStage = !isPhone && ["stage-flow", "stage-steps", "stage-tilt", "wall"].includes(state.npPane);

      return `
        <div class="np-layer" style="--np-accent:${tr.accent}">
          <div class="np-ambient-bg ${state.playing ? "playing" : ""}" style="background:radial-gradient(circle at 24% 30%, ${tr.palette[0]} 0%, transparent 56%), radial-gradient(circle at 76% 70%, ${tr.palette[1]} 0%, transparent 60%)"></div>
          <div class="np-content-wrap">
            <div class="np-topbar">
              <button class="icon-btn" data-action="${closeAction}" style="color:rgba(255,255,255,0.82);background:rgba(255,255,255,0.10)">${ICONS.chevDown}</button>
              ${isPhone ? `
                <div class="np-pill-tabs">
                  <button class="np-pill-tab ${state.phoneNpMode === "cover" ? "active" : ""}" data-action="phone-np-mode" data-mode="cover">封面</button>
                  <button class="np-pill-tab ${state.phoneNpMode === "lyrics" ? "active" : ""}" data-action="phone-np-mode" data-mode="lyrics">歌词</button>
                  <button class="np-pill-tab ${state.phoneNpMode === "stage" ? "active" : ""}" data-action="phone-np-mode" data-mode="stage">舞台</button>
                </div>
                <button class="icon-btn" data-action="cycle-player-style" title="切换封面/黑胶/磁带" style="color:#fff;background:rgba(255,255,255,0.10)">${ICONS.album}</button>
              ` : `
                <div class="np-pill-tabs">
                  <button class="np-pill-tab ${state.npPane === "lyrics" ? "active" : ""}" data-action="np-pane" data-pane="lyrics">歌词</button>
                  <button class="np-pill-tab ${state.npPane === "stage-flow" ? "active" : ""}" data-action="np-pane" data-pane="stage-flow">舞台·流光</button>
                  <button class="np-pill-tab ${state.npPane === "stage-steps" ? "active" : ""}" data-action="np-pane" data-pane="stage-steps">舞台·云阶</button>
                  <button class="np-pill-tab ${state.npPane === "stage-tilt" ? "active" : ""}" data-action="np-pane" data-pane="stage-tilt">舞台·倾诉</button>
                  <button class="np-pill-tab ${state.npPane === "wall" ? "active" : ""}" data-action="np-pane" data-pane="wall">封面墙</button>
                  <button class="np-pill-tab ${state.npPane === "queue" ? "active" : ""}" data-action="np-pane" data-pane="queue">队列</button>
                  <button class="np-pill-tab ${state.npPane === "comments" ? "active" : ""}" data-action="np-pane" data-pane="comments">评论</button>
                </div>
                <div class="np-pill-tabs">
                  <button class="np-pill-tab ${state.npPlayerStyle === "cover" ? "active" : ""}" data-action="np-style" data-style="cover">封面</button>
                  <button class="np-pill-tab ${state.npPlayerStyle === "vinyl" ? "active" : ""}" data-action="np-style" data-style="vinyl">黑胶</button>
                  <button class="np-pill-tab ${state.npPlayerStyle === "cassette" ? "active" : ""}" data-action="np-style" data-style="cassette">磁带</button>
                </div>
              `}
            </div>

            ${isPhone ? `
              <div style="flex:1;min-height:0;padding:12px 24px 22px;display:flex;flex-direction:column;justify-content:space-between">
                ${state.phoneNpMode === "cover" ? `
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
                    ${renderVisualCenterpiece(tr, "sm")}
                    <div style="text-align:center;max-width:100%">
                      <div style="font-size:17px;font-weight:700;color:#fff">${curLine.text}</div>
                      ${curLine.trans ? `<div style="font-size:13px;color:var(--np-muted);margin-top:3px">${curLine.trans}</div>` : ""}
                    </div>
                  </div>
                ` : state.phoneNpMode === "lyrics" ? `
                  <div style="flex:1;min-height:0">${renderLyricsBody(tr)}</div>
                ` : `
                  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center">
                    <span class="quality-pill" style="background:rgba(255,255,255,0.14);color:#fff;border-color:transparent">Folia 舞台 · ${curLine.words ? "逐字同步" : "标准"}</span>
                    <div style="font-size:28px;font-weight:800;line-height:1.3">${curLine.text}</div>
                    ${curLine.trans ? `<div style="font-size:15px;color:var(--np-muted)">${curLine.trans}</div>` : ""}
                  </div>
                `}

                <div style="display:flex;flex-direction:column;gap:14px;flex-shrink:0">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                    <div style="min-width:0">
                      <div class="truncate" style="font-size:20px;font-weight:700">${tr.name}</div>
                      <div class="truncate" style="font-size:14px;color:var(--np-muted)">${tr.artist} · ${tr.quality}</div>
                    </div>
                    <button class="icon-btn touch heart-btn ${liked ? "liked" : ""}" data-action="toggle-like" data-id="${tr.id}" style="color:${liked ? tr.accent : "#fff"}">${liked ? ICONS.heartFill : ICONS.heart}</button>
                  </div>
                  <div>
                    <div data-action="seek-bar" style="height:28px;display:flex;align-items:center;cursor:pointer">
                      <div style="width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,0.22);overflow:hidden">
                        <div class="js-np-bar-fill" style="width:${pct}%;height:100%;background:#fff;border-radius:99px"></div>
                      </div>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--np-muted)" class="tabular">
                      <span class="js-pos-label">${fmtTime(state.positionSec)}</span>
                      <span>${fmtTime(tr.duration)}</span>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;justify-content:space-around">
                    <button class="icon-btn touch" data-action="toggle-shuffle" style="color:${state.shuffle ? tr.accent : "var(--np-muted)"}">${ICONS.shuffle}</button>
                    <button class="icon-btn touch" data-action="prev-track" style="color:#fff">${ICONS.prev}</button>
                    <button class="play-circle-btn lg" data-action="toggle-play">${state.playing ? ICONS.pause : ICONS.play}</button>
                    <button class="icon-btn touch" data-action="next-track" style="color:#fff">${ICONS.next}</button>
                    <button class="icon-btn touch" data-action="cycle-repeat" style="color:${state.repeat !== "off" ? tr.accent : "var(--np-muted)"}">${ICONS.repeat}</button>
                  </div>
                  <div style="display:flex;justify-content:space-around;padding-top:2px">
                    <button class="nsh-btn ghost" data-action="phone-sheet" data-sheet="comments" style="color:var(--np-muted);font-size:12px">${ICONS.comment}<span>评论 (${tr.comments.length})</span></button>
                    <button class="nsh-btn ghost" data-action="cycle-player-style" style="color:var(--np-muted);font-size:12px">${ICONS.album}<span>样式: ${state.npPlayerStyle === "cover" ? "封面" : state.npPlayerStyle === "vinyl" ? "黑胶" : "磁带"}</span></button>
                    <button class="nsh-btn ghost" data-action="phone-sheet" data-sheet="queue" style="color:var(--np-muted);font-size:12px">${ICONS.queue}<span>队列</span></button>
                  </div>
                </div>
              </div>
            ` : isFullStage ? `
              ${state.npPane === "wall" ? `
                <div class="cover-wall-grid">
                  ${[...TRACKS, ...TRACKS, ...TRACKS, ...TRACKS].map((wtr, wi) => `
                    <button class="wall-tile" data-action="play-track" data-idx="${wi % TRACKS.length}">
                      <img src="${wtr.cover}" alt="" style="width:100%;height:100%;object-fit:cover"/>
                    </button>
                  `).join("")}
                </div>
              ` : `
                <div class="stage-canvas">
                  <div style="font-size:13px;color:var(--np-muted);letter-spacing:0.06em;text-transform:uppercase">${tr.name} — ${tr.artist}</div>
                  ${state.npPane === "stage-flow" ? `
                    <div class="stage-flow-active">${curLine.text}</div>
                    ${curLine.trans ? `<div style="font-size:18px;color:var(--np-muted)">${curLine.trans}</div>` : ""}
                  ` : state.npPane === "stage-steps" ? `
                    <div class="stage-steps-wrap">
                      ${(curLine.words || [curLine.text]).filter(w => w.trim()).slice(0, 4).map((w, wi) => `
                        <div class="stage-step-row ${wi % 2 === 0 ? "left" : "right"}">${w}</div>
                      `).join("")}
                    </div>
                  ` : `
                    <div class="stage-tilt-wrap">
                      <div style="font-size:36px;font-weight:800">${(curLine.words || [curLine.text]).slice(0, 2).join(" ")}</div>
                      <div class="stage-tilt-leaning">${(curLine.words || [curLine.text]).slice(2).join(" ") || curLine.text}</div>
                      ${curLine.trans ? `<div style="font-size:16px;color:var(--np-muted);margin-top:8px">${curLine.trans}</div>` : ""}
                    </div>
                  `}
                </div>
              `}
              <div style="height:76px;padding:0 28px;background:rgba(11,11,13,0.55);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;gap:16px">
                <div style="display:flex;align-items:center;gap:12px">
                  <img src="${tr.cover}" alt="" style="width:42px;height:42px;border-radius:8px"/>
                  <div>
                    <div style="font-weight:600;font-size:13.5px">${tr.name}</div>
                    <div style="font-size:12px;color:var(--np-muted)">${tr.artist}</div>
                  </div>
                </div>
                <div class="transport-row">
                  <button class="icon-btn" data-action="prev-track" style="color:#fff">${ICONS.prev}</button>
                  <button class="play-circle-btn" data-action="toggle-play" style="background:#fff;color:#0b0b0d">${state.playing ? ICONS.pause : ICONS.play}</button>
                  <button class="icon-btn" data-action="next-track" style="color:#fff">${ICONS.next}</button>
                </div>
                <div class="tabular" style="font-size:12px;color:var(--np-muted)"><span class="js-pos-label">${fmtTime(state.positionSec)}</span> / ${fmtTime(tr.duration)}</div>
              </div>
            ` : `
              <div class="np-split-body">
                <div class="np-left-col">
                  ${renderVisualCenterpiece(tr, "lg")}
                  <div style="width:min(320px,100%);display:flex;flex-direction:column;gap:12px">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                      <div style="min-width:0">
                        <div class="truncate" style="font-size:18px;font-weight:700">${tr.name}</div>
                        <div class="truncate" style="font-size:13px;color:var(--np-muted)">${tr.artist} — ${tr.album}</div>
                      </div>
                      <button class="icon-btn heart-btn ${liked ? "liked" : ""}" data-action="toggle-like" data-id="${tr.id}" style="color:${liked ? tr.accent : "#fff"}">${liked ? ICONS.heartFill : ICONS.heart}</button>
                    </div>
                    <div>
                      <div data-action="seek-bar" style="height:20px;display:flex;align-items:center;cursor:pointer">
                        <div style="width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,0.22);overflow:hidden">
                          <div class="js-np-bar-fill" style="width:${pct}%;height:100%;background:#fff;border-radius:99px"></div>
                        </div>
                      </div>
                      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--np-muted)" class="tabular">
                        <span class="js-pos-label">${fmtTime(state.positionSec)}</span>
                        <span>${fmtTime(tr.duration)}</span>
                      </div>
                    </div>
                    <div class="transport-row" style="justify-content:center;gap:14px">
                      <button class="icon-btn" data-action="toggle-shuffle" style="color:${state.shuffle ? tr.accent : "var(--np-muted)"}">${ICONS.shuffle}</button>
                      <button class="icon-btn" data-action="prev-track" style="color:#fff">${ICONS.prev}</button>
                      <button class="play-circle-btn" data-action="toggle-play" style="width:46px;height:46px;background:#fff;color:#0b0b0d">${state.playing ? ICONS.pause : ICONS.play}</button>
                      <button class="icon-btn" data-action="next-track" style="color:#fff">${ICONS.next}</button>
                      <button class="icon-btn" data-action="cycle-repeat" style="color:${state.repeat !== "off" ? tr.accent : "var(--np-muted)"}">${ICONS.repeat}</button>
                    </div>
                  </div>
                </div>
                <div style="min-width:0">${rightPaneHtml}</div>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. DEVICE SHELLS (PC / PAD / PHONE)
    // =========================================================================
    function renderDesktopApp(inOverview = false) {
      const src = currentSource();
      const tr = currentTrack();
      const pct = Math.min(100, Math.max(0, (state.positionSec / tr.duration) * 100));
      const liked = state.likedIds.has(tr.id);
      const isMac = state.desktopOs === "macos";

      return `
        <div class="desktop-window" style="${inOverview ? "width:1080px;height:680px" : ""}">
          <!-- Sidebar -->
          <aside class="desktop-sidebar ${state.desktopSidebarCollapsed ? "collapsed" : ""}">
            <div class="win-traffic-zone">
              ${isMac ? `<div class="traffic-lights"><span class="tl close"></span><span class="tl min"></span><span class="tl max"></span></div>` : `<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px"><span style="color:var(--accent)">${ICONS.note}</span><span class="hide-when-collapsed">nsh-music</span></div>`}
              <button class="icon-btn" data-action="toggle-desktop-sidebar" title="折叠/展开侧边栏">${ICONS.menu}</button>
            </div>

            <div class="source-switcher-wrap">
              <button class="source-trigger" data-action="toggle-desktop-source-menu">
                <span style="color:var(--accent);display:grid;place-items:center">${ICONS[src.icon] || ICONS.note}</span>
                <span class="truncate hide-when-collapsed" style="flex:1;text-align:left">${src.name}</span>
                <span class="hide-when-collapsed" style="color:var(--muted)">${ICONS.chevDown}</span>
              </button>
              ${state.desktopSourceMenuOpen ? `
                <div class="popover-panel" style="top:46px;left:10px;width:236px">
                  ${SOURCES.map(s => `
                    <button class="menu-item" data-action="switch-source" data-src="${s.id}">
                      <span style="display:flex;align-items:center;gap:8px">${ICONS[s.icon] || ICONS.note}<span>${s.name}</span></span>
                      <span style="font-size:11px;color:${s.id === src.id ? "var(--accent)" : "var(--muted)"}">${s.id === src.id ? "● 当前" : s.badge}</span>
                    </button>
                  `).join("")}
                  <div class="menu-sep"></div>
                  <button class="menu-item" data-action="desktop-nav" data-page="settings">
                    <span style="display:flex;align-items:center;gap:8px;color:var(--accent)">${ICONS.plus}<span>管理与安装插件…</span></span>
                  </button>
                </div>
              ` : ""}
            </div>

            <div class="sidebar-scroll">
              <div class="nav-group-label hide-when-collapsed">发现</div>
              ${src.nav.map(item => `
                <button class="nav-row ${state.desktopPage === item.id ? "active" : ""}" data-action="desktop-nav" data-page="${item.id}">
                  ${ICONS[item.icon] || ICONS.home}
                  <span class="truncate hide-when-collapsed">${item.label}</span>
                </button>
              `).join("")}

              <div class="nav-group-label hide-when-collapsed">资料库</div>
              <button class="nav-row ${state.desktopPage === "liked" ? "active" : ""}" data-action="desktop-nav" data-page="liked">
                ${ICONS.heart}<span class="truncate hide-when-collapsed">喜欢的音乐</span>
              </button>
              <button class="nav-row ${state.desktopPage === "savedAlbums" ? "active" : ""}" data-action="desktop-nav" data-page="savedAlbums">
                ${ICONS.album}<span class="truncate hide-when-collapsed">收藏的专辑</span>
              </button>

              <div class="nav-group-label hide-when-collapsed">
                <span>我的歌单</span>
                <button class="icon-btn" style="width:20px;height:20px" title="新建歌单">${ICONS.plus}</button>
              </div>
              ${src.playlists.map(pl => `
                <button class="nav-row" data-action="desktop-nav" data-page="liked">
                  ${ICONS.playlist}<span class="truncate hide-when-collapsed">${pl.name}</span>
                </button>
              `).join("")}
            </div>
          </aside>

          <!-- Main Content Column -->
          <section class="desktop-main">
            <div class="desktop-topbar">
              <div style="display:flex;align-items:center;gap:6px">
                <button class="icon-btn" data-action="desktop-nav" data-page="home" title="返回首页">${ICONS.chevLeft}</button>
                <button class="icon-btn disabled">${ICONS.chevRight}</button>
                <div class="search-pill">
                  ${ICONS.search}
                  <input type="text" placeholder="搜索歌曲、专辑、艺人、播客…" value="${state.searchQuery}" data-action="search-input" data-target="desktop"/>
                  <span class="kbd-chip">⌘F</span>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px">
                <span class="compat-badge ${src.compatClass}" style="cursor:pointer" data-action="desktop-nav" data-page="settings">${src.compatLabel}</span>
                <button class="nsh-btn secondary" style="height:28px;padding:0 10px;font-size:12px;gap:6px" data-action="desktop-nav" data-page="settings">
                  <span style="width:18px;height:18px;border-radius:99px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px">${src.account.name.slice(0,1)}</span>
                  <span class="truncate" style="max-width:110px">${src.account.name}</span>
                </button>
                <button class="icon-btn ${state.desktopPage === "settings" ? "active-pill" : ""}" data-action="desktop-nav" data-page="settings" title="设置与插件">${ICONS.settings}</button>
                ${!isMac ? `<div class="win-controls">
                  <button class="win-ctrl-btn">—</button>
                  <button class="win-ctrl-btn">□</button>
                  <button class="win-ctrl-btn close">✕</button>
                </div>` : ""}
              </div>
            </div>

            <div class="desktop-content-scroll">
              ${renderMainPageBody(state.desktopPage, { cols: state.desktopSidebarCollapsed ? "cols-5" : "cols-4", showAlbum: true })}
            </div>

            ${state.desktopQueueOpen ? `
              <div class="popover-panel" style="right:18px;bottom:94px;width:320px;max-height:420px;overflow-y:auto;padding:12px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <strong style="font-size:13.5px">播放队列 (${TRACKS.length})</strong>
                  <button class="icon-btn" data-action="toggle-desktop-queue" style="width:24px;height:24px">✕</button>
                </div>
                ${renderTrackRows(TRACKS, {})}
              </div>
            ` : ""}

            ${state.desktopTrackMenuIdx !== null ? `
              <div class="popover-panel" style="right:68px;bottom:140px">
                <button class="menu-item" data-action="play-track" data-idx="${state.desktopTrackMenuIdx}"><span>立即播放</span><span class="kbd-chip">Enter</span></button>
                <button class="menu-item" data-action="close-menus"><span>下一首播放</span></button>
                <button class="menu-item" data-action="close-menus"><span>添加到歌单 ›</span></button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-action="open-desktop-np"><span>查看歌词与评论</span></button>
                <button class="menu-item danger" data-action="close-menus"><span>从列表中移除</span></button>
              </div>
            ` : ""}

            <!-- 84px Floating Player Bar -->
            <footer class="desktop-player-bar">
              <div class="scrubber-edge" data-action="seek-bar">
                <div class="scrubber-track">
                  <div class="scrubber-fill js-pb-fill ${state.playing ? "smoking" : ""}" style="width:${pct}%">
                    <span class="scrubber-knob"></span>
                  </div>
                </div>
              </div>

              <div class="pb-left">
                <button class="pb-cover-btn" data-action="open-desktop-np" title="展开 Now Playing 沉浸舞台">
                  <img src="${tr.cover}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"/>
                  <span class="pb-cover-hint">${ICONS.chevUp}</span>
                </button>
                <div style="min-width:0">
                  <div class="truncate" style="font-size:13.5px;font-weight:600;cursor:pointer" data-action="open-desktop-np">${tr.name}</div>
                  <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
                    <span class="truncate" style="font-size:12px;color:var(--muted)">${tr.artist}</span>
                    <span class="quality-pill">${tr.quality}</span>
                  </div>
                </div>
                <button class="icon-btn heart-btn ${liked ? "liked" : ""}" data-action="toggle-like" data-id="${tr.id}">${liked ? ICONS.heartFill : ICONS.heart}</button>
              </div>

              <div class="pb-center">
                <div class="transport-row">
                  <button class="icon-btn" data-action="toggle-shuffle" style="color:${state.shuffle ? "var(--accent)" : "var(--muted)"}" title="随机播放">${ICONS.shuffle}</button>
                  <button class="icon-btn" data-action="prev-track" title="上一首">${ICONS.prev}</button>
                  <button class="play-circle-btn" data-action="toggle-play" title="播放/暂停 (Space)">${state.playing ? ICONS.pause : ICONS.play}</button>
                  <button class="icon-btn" data-action="next-track" title="下一首">${ICONS.next}</button>
                  <button class="icon-btn" data-action="cycle-repeat" style="color:${state.repeat !== "off" ? "var(--accent)" : "var(--muted)"}" title="循环模式">${ICONS.repeat}</button>
                </div>
                <div class="tabular" style="font-size:11px;color:var(--muted)"><span class="js-pos-label">${fmtTime(state.positionSec)}</span> / ${fmtTime(tr.duration)}</div>
              </div>

              <div class="pb-right">
                <button class="icon-btn" data-action="open-desktop-np" title="歌词与舞台">${ICONS.lyrics}</button>
                <button class="icon-btn ${state.desktopQueueOpen ? "active-pill" : ""}" data-action="toggle-desktop-queue" title="播放队列">${ICONS.queue}</button>
                <button class="icon-btn" data-action="toggle-desktop-vol" title="音量">${state.muted || state.volume === 0 ? ICONS.mute : ICONS.volume}</button>
                <div data-action="vol-bar" style="width:74px;height:18px;display:flex;align-items:center;cursor:pointer" title="拖拽调节音量">
                  <div style="width:100%;height:4px;border-radius:99px;background:var(--border-strong);overflow:hidden">
                    <div style="width:${state.muted ? 0 : state.volume * 100}%;height:100%;background:var(--fg)"></div>
                  </div>
                </div>
                ${state.desktopVolOpen ? `
                  <div class="popover-panel" style="right:14px;bottom:76px;min-width:auto;width:54px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px">
                    <span class="tabular" style="font-size:11px;font-weight:600;color:var(--muted)">${Math.round((state.muted ? 0 : state.volume) * 100)}%</span>
                    <div style="width:6px;height:100px;border-radius:99px;background:var(--border-strong);position:relative;overflow:hidden">
                      <div style="position:absolute;bottom:0;left:0;right:0;height:${(state.muted ? 0 : state.volume) * 100}%;background:var(--accent)"></div>
                    </div>
                  </div>
                ` : ""}
              </div>
            </footer>
          </section>

          ${state.desktopInstallModal ? `
            <div class="sheet-backdrop" style="justify-content:center;align-items:center">
              <div style="width:440px;max-width:92%;background:var(--popover);border:1px solid var(--border-strong);border-radius:16px;padding:20px;box-shadow:var(--shadow-pop)">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                  <strong style="font-size:16px">安装 mygo-music 插件</strong>
                  <button class="icon-btn" data-action="toggle-install-modal">✕</button>
                </div>
                <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px">支持直接输入 GitHub 仓库（如 <code>hubandad/mygo-music-netease</code>）或本地文件夹 / ZIP 包。TypeScript 插件将由内置 <code>oxc</code> 零依赖编译。</p>
                <div style="height:36px;padding:0 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;font-size:13px;color:var(--muted);margin-bottom:14px">https://github.com/egoist/mygo-music-youtube-music</div>
                <div style="display:flex;justify-content:flex-end;gap:8px">
                  <button class="nsh-btn secondary" data-action="toggle-install-modal">取消</button>
                  <button class="nsh-btn primary" data-action="toggle-install-modal">安装并校验权限</button>
                </div>
              </div>
            </div>
          ` : ""}

          ${state.desktopNpOpen ? renderNowPlayingOverlay({ closeAction: "close-desktop-np" }) : ""}
        </div>
      `;
    }

    function renderPadApp(inOverview = false) {
      const src = currentSource();
      const tr = currentTrack();
      const isLandscape = state.padOrientation === "landscape" || inOverview;
      const pct = Math.min(100, Math.max(0, (state.positionSec / tr.duration) * 100));
      const liked = state.likedIds.has(tr.id);

      const frameStyle = inOverview
        ? "width:820px;height:580px"
        : "";

      return `
        <div class="pad-frame ${isLandscape ? "landscape" : "portrait"}" style="${frameStyle}">
          <div class="pad-screen">
            ${isLandscape ? `
              <aside class="pad-rail ${state.padRailExpanded ? "expanded" : ""}">
                <button class="pad-rail-btn" data-action="toggle-pad-rail" title="展开/收起导航轨">
                  ${ICONS.menu}
                  ${state.padRailExpanded ? `<span>收起侧栏</span>` : ""}
                </button>
                ${src.nav.map(n => `
                  <button class="pad-rail-btn ${state.padPage === n.id ? "active" : ""}" data-action="pad-nav" data-page="${n.id}" title="${n.label}">
                    ${ICONS[n.icon] || ICONS.home}
                    ${state.padRailExpanded ? `<span class="truncate">${n.label}</span>` : ""}
                  </button>
                `).join("")}
                <div style="height:1px;width:100%;background:var(--border);margin:4px 0"></div>
                <button class="pad-rail-btn ${state.padPage === "liked" ? "active" : ""}" data-action="pad-nav" data-page="liked" title="喜欢的音乐">
                  ${ICONS.heart}${state.padRailExpanded ? `<span>喜欢的音乐</span>` : ""}
                </button>
                <button class="pad-rail-btn ${state.padPage === "settings" ? "active" : ""}" data-action="pad-nav" data-page="settings" title="设置">
                  ${ICONS.settings}${state.padRailExpanded ? `<span>设置与插件</span>` : ""}
                </button>
              </aside>
            ` : ""}

            <div style="flex:1;min-width:0;display:flex;flex-direction:column;position:relative">
              <div style="height:56px;padding:0 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--glass);backdrop-filter:blur(16px);flex-shrink:0">
                <div style="display:flex;align-items:center;gap:8px">
                  ${!isLandscape ? `<button class="icon-btn touch" data-action="toggle-pad-drawer">${ICONS.menu}</button>` : ""}
                  <button class="source-capsule" data-action="toggle-pad-source" style="position:relative">
                    <span style="color:var(--accent)">${ICONS[src.icon] || ICONS.note}</span>
                    <span class="truncate">${src.name}</span>
                    ${ICONS.chevDown}
                  </button>
                </div>
                <div class="search-pill" style="height:36px;flex:1;max-width:300px;border-radius:99px">
                  ${ICONS.search}
                  <input type="text" placeholder="搜索歌曲、播客…" value="${state.searchQuery}" data-action="search-input" style="font-size:14px"/>
                </div>
                <button class="icon-btn touch" data-action="pad-nav" data-page="settings">${ICONS.settings}</button>
              </div>

              ${state.padSourceMenuOpen ? `
                <div class="popover-panel" style="top:54px;left:${isLandscape ? 16 : 64}px">
                  ${SOURCES.map(s => `
                    <button class="menu-item" data-action="switch-source" data-src="${s.id}">
                      <span>${s.name}</span>
                      <span style="font-size:11px;color:var(--muted)">${s.id === src.id ? "● 当前" : s.badge}</span>
                    </button>
                  `).join("")}
                </div>
              ` : ""}

              <div style="flex:1;overflow-y:auto;padding:20px 24px 106px">
                ${renderMainPageBody(state.padPage, { cols: isLandscape ? "cols-4" : "cols-3", touch: true })}
              </div>

              <!-- 72px Floating Capsule Player -->
              <div class="pad-floating-player" data-action="open-pad-np" style="cursor:pointer">
                <div style="position:absolute;left:18px;right:18px;bottom:0;height:2.5px;background:var(--border);border-radius:99px;overflow:hidden">
                  <div class="js-pb-fill" style="width:${pct}%;height:100%;background:var(--accent)"></div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1">
                  <img src="${tr.cover}" alt="" style="width:46px;height:46px;border-radius:10px;object-fit:cover"/>
                  <div style="min-width:0">
                    <div class="truncate" style="font-size:14.5px;font-weight:600">${tr.name}</div>
                    <div class="truncate" style="font-size:12px;color:var(--muted)">${tr.artist} · ${tr.quality}</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:4px" onclick="event.stopPropagation()">
                  <button class="icon-btn touch heart-btn ${liked ? "liked" : ""}" data-action="toggle-like" data-id="${tr.id}">${liked ? ICONS.heartFill : ICONS.heart}</button>
                  <button class="icon-btn touch" data-action="prev-track">${ICONS.prev}</button>
                  <button class="play-circle-btn" style="width:42px;height:42px" data-action="toggle-play">${state.playing ? ICONS.pause : ICONS.play}</button>
                  <button class="icon-btn touch" data-action="next-track">${ICONS.next}</button>
                  <button class="icon-btn touch" data-action="open-pad-np">${ICONS.lyrics}</button>
                </div>
              </div>
            </div>

            ${state.padDrawerOpen ? `
              <div class="sheet-backdrop left" data-action="close-pad-drawer">
                <div class="drawer-sheet" onclick="event.stopPropagation()">
                  <div style="font-size:18px;font-weight:800;padding:8px 10px 14px">nsh-music</div>
                  ${src.nav.map(n => `
                    <button class="nav-row" style="height:44px;font-size:15px" data-action="pad-nav" data-page="${n.id}">${ICONS[n.icon] || ICONS.home}<span>${n.label}</span></button>
                  `).join("")}
                  <div class="menu-sep"></div>
                  <button class="nav-row" style="height:44px;font-size:15px" data-action="pad-nav" data-page="liked">${ICONS.heart}<span>喜欢的音乐</span></button>
                  <button class="nav-row" style="height:44px;font-size:15px" data-action="pad-nav" data-page="settings">${ICONS.settings}<span>设置与插件</span></button>
                </div>
              </div>
            ` : ""}

            ${state.padNpOpen ? renderNowPlayingOverlay({ closeAction: "close-pad-np", isPhone: !isLandscape }) : ""}
          </div>
        </div>
      `;
    }

    function renderPhoneApp(inOverview = false) {
      const src = currentSource();
      const tr = currentTrack();
      const pct = Math.min(100, Math.max(0, (state.positionSec / tr.duration) * 100));
      const isIos = state.phoneOs === "ios";

      let bodyPage = state.phoneTab;
      if (state.phoneTab === "home") bodyPage = state.phoneCustomNav;

      return `
        <div class="phone-frame" style="${inOverview ? "width:375px;height:760px" : ""}">
          <div class="phone-screen">
            <!-- Status bar -->
            <div class="phone-status-bar">
              <span>9:41</span>
              ${isIos ? `<div class="dynamic-island"><span style="width:8px;height:8px;border-radius:99px;background:#1e293b"></span></div>` : `<div class="punch-hole"></div>`}
              <span style="display:flex;align-items:center;gap:5px;font-size:11.5px">
                <span>5G</span>
                <span style="padding:1px 4px;border-radius:3px;border:1px solid currentColor;font-size:9.5px">92%</span>
              </span>
            </div>

            <!-- App Header -->
            <div class="phone-header">
              <button class="source-capsule" data-action="phone-sheet" data-sheet="sourcePicker">
                <span style="color:var(--accent);display:grid;place-items:center">${ICONS[src.icon] || ICONS.note}</span>
                <span class="truncate">${src.name}</span>
                ${ICONS.chevDown}
              </button>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="icon-btn touch" data-action="phone-sheet" data-sheet="settings" title="设置与插件">${ICONS.settings}</button>
              </div>
            </div>

            ${state.phoneTab === "home" ? `
              <div class="phone-nav-pills">
                ${src.nav.map(n => `
                  <button class="phone-pill ${state.phoneCustomNav === n.id ? "active" : ""}" data-action="phone-custom-nav" data-page="${n.id}">${n.label}</button>
                `).join("")}
              </div>
            ` : ""}

            <div class="phone-scroll">
              ${renderMainPageBody(bodyPage, { cols: "cols-2", touch: true, menuAction: "phone-track-menu" })}
            </div>

            <!-- Floating 58px Mini Player -->
            <div class="phone-mini-player" data-action="open-phone-np" style="cursor:pointer">
              <div class="phone-mini-progress"><i class="js-pb-fill" style="width:${pct}%"></i></div>
              <img src="${tr.cover}" alt="" style="width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0"/>
              <div style="flex:1;min-width:0">
                <div class="truncate" style="font-size:13.5px;font-weight:600">${tr.name}</div>
                <div class="truncate" style="font-size:11.5px;color:var(--muted)">${tr.artist}</div>
              </div>
              <button class="icon-btn touch" data-action="toggle-play" onclick="event.stopPropagation()" style="color:var(--fg)">${state.playing ? ICONS.pause : ICONS.play}</button>
              <button class="icon-btn touch" data-action="phone-sheet" data-sheet="queue" onclick="event.stopPropagation()">${ICONS.queue}</button>
            </div>

            <!-- Bottom 4-Tab Bar (iOS UITabBar vs HarmonyOS/Android Navigation Bar) -->
            <nav class="phone-tabbar ${isIos ? "ios-floating" : ""}">
              ${[
                { id: "home", label: "发现", icon: "home" },
                { id: "explore", label: "电台播客", icon: "radio" },
                { id: "library", label: "资料库", icon: "library" },
                { id: "search", label: "搜索", icon: "search" }
              ].map(t => `
                <button class="phone-tab-item ${state.phoneTab === t.id ? "active" : ""}" data-action="phone-tab" data-tab="${t.id}">
                  <span class="${!isIos ? "ohos-tab-pill" : ""}">${ICONS[t.icon]}</span>
                  <span>${t.label}</span>
                </button>
              `).join("")}
            </nav>

            ${!isIos ? `<div class="home-indicator"></div>` : ""}

            <!-- Phone Fullscreen Now Playing -->
            ${state.phoneNpOpen ? renderNowPlayingOverlay({ closeAction: "close-phone-np", isPhone: true }) : ""}

            <!-- Phone Native Bottom Sheets -->
            ${state.phoneSheet ? `
              <div class="sheet-backdrop" data-action="close-phone-sheet">
                <div class="bottom-sheet" onclick="event.stopPropagation()">
                  <div class="sheet-handle"></div>
                  ${state.phoneSheet === "sourcePicker" ? `
                    <div style="font-size:17px;font-weight:700;margin-bottom:12px">切换音源与插件</div>
                    <div style="display:flex;flex-direction:column;gap:8px">
                      ${SOURCES.map(s => `
                        <button data-action="switch-source" data-src="${s.id}" style="min-height:54px;padding:10px 12px;border-radius:12px;background:${s.id === src.id ? "var(--accent-soft)" : "var(--card)"};display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left">
                          <div style="display:flex;align-items:center;gap:10px">
                            <span style="color:var(--accent)">${ICONS[s.icon] || ICONS.note}</span>
                            <div>
                              <div style="font-weight:600;font-size:14.5px">${s.name}</div>
                              <div style="font-size:11.5px;color:var(--muted)">${s.compatLabel}</div>
                            </div>
                          </div>
                          ${s.id === src.id ? `<span style="color:var(--accent);font-weight:700">✓</span>` : ""}
                        </button>
                      `).join("")}
                      <button class="nsh-btn outline" style="height:44px;margin-top:4px" data-action="phone-sheet" data-sheet="settings">${ICONS.settings}<span>管理与安装插件…</span></button>
                    </div>
                  ` : state.phoneSheet === "trackMenu" ? (() => {
                    const mtr = TRACKS[state.phoneSheetTrackIdx] || tr;
                    return `
                      <div style="display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:8px">
                        <img src="${mtr.cover}" style="width:46px;height:46px;border-radius:8px"/>
                        <div style="min-width:0">
                          <div class="truncate" style="font-weight:700;font-size:15px">${mtr.name}</div>
                          <div class="truncate" style="font-size:12.5px;color:var(--muted)">${mtr.artist} · ${mtr.quality}</div>
                        </div>
                      </div>
                      <button class="menu-item" style="height:46px;font-size:15px" data-action="play-track" data-idx="${state.phoneSheetTrackIdx}"><span>立即播放</span></button>
                      <button class="menu-item" style="height:46px;font-size:15px" data-action="toggle-like" data-id="${mtr.id}"><span>${state.likedIds.has(mtr.id) ? "取消喜欢" : "添加到喜欢的音乐"}</span></button>
                      <button class="menu-item" style="height:46px;font-size:15px" data-action="close-phone-sheet"><span>添加到歌单…</span></button>
                      <button class="menu-item" style="height:46px;font-size:15px" data-action="open-phone-np"><span>查看歌词与热评</span></button>
                    `;
                  })() : state.phoneSheet === "queue" ? `
                    <div style="font-size:17px;font-weight:700;margin-bottom:10px">播放队列 (${TRACKS.length})</div>
                    ${renderTrackRows(TRACKS, { touch: true })}
                  ` : state.phoneSheet === "comments" ? `
                    <div style="font-size:17px;font-weight:700;margin-bottom:10px">热门评论 · ${tr.name}</div>
                    <div style="display:flex;flex-direction:column;gap:10px">
                      ${tr.comments.map(c => `
                        <div style="padding:12px;border-radius:12px;background:var(--card)">
                          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
                            <strong>${c.author}</strong><span style="color:var(--accent)">♥ ${c.likes}</span>
                          </div>
                          <div style="font-size:13.5px">${c.text}</div>
                        </div>
                      `).join("")}
                    </div>
                  ` : `
                    <div style="font-size:17px;font-weight:700;margin-bottom:10px">插件与内置 FFmpeg 状态</div>
                    ${renderPluginCards(true)}
                  `}
                </div>
              </div>
            ` : ""}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. TAB VIEWS (Overview / Desktop / Pad / Phone / NowPlaying / System)
    // =========================================================================
    function renderOverview() {
      return `
        <div class="sub-toolbar">
          <div class="sub-toolbar-group">
            <span class="hint-pill">✨ <strong>三态实时联动</strong>：任意端点击播放、切歌、点赞或切换音源，三台设备状态同步更新</span>
          </div>
          <div class="sub-toolbar-group">
            <span class="hint-pill">当前曲目：<strong>${currentTrack().name}</strong> (${currentTrack().quality})</span>
          </div>
        </div>

        <div class="overview-grid">
          <div class="device-card">
            <div class="device-card-head">
              <div class="device-meta">
                <strong>PC 桌面端 <span class="tier-tag">macOS · Win · Linux</span></strong>
                <span>自绘 44pt 顶栏 · 232pt 侧边栏 · 84pt 底部播控 + 彗星进度条</span>
              </div>
              <button class="studio-btn" data-action="studio-tab" data-tab="desktop">放大体验 ↗</button>
            </div>
            <div class="scale-box" style="width:626px;height:395px">
              <div class="scale-inner" style="width:1080px;height:680px;transform:scale(0.58)">
                ${renderDesktopApp(true)}
              </div>
            </div>
          </div>

          <div class="device-card">
            <div class="device-card-head">
              <div class="device-meta">
                <strong>Pad 平板端 <span class="tier-tag">HarmonyOS · iPadOS · Android</span></strong>
                <span>≥44pt 触控目标 · 72/220pt 可折叠轨 · 72pt 悬浮胶囊播放条</span>
              </div>
              <button class="studio-btn" data-action="studio-tab" data-tab="pad">放大体验 ↗</button>
            </div>
            <div class="scale-box" style="width:476px;height:337px">
              <div class="scale-inner" style="width:820px;height:580px;transform:scale(0.58)">
                ${renderPadApp(true)}
              </div>
            </div>
          </div>

          <div class="device-card">
            <div class="device-card-head">
              <div class="device-meta">
                <strong>Phone 手机端 <span class="tier-tag">OHOS Tier-1 · iOS · Android</span></strong>
                <span>顶栏音源胶囊 + Sheet · 4-Tab 原生底栏 · 58pt Mini 胶囊</span>
              </div>
              <button class="studio-btn" data-action="studio-tab" data-tab="phone">放大体验 ↗</button>
            </div>
            <div class="scale-box" style="width:214px;height:434px">
              <div class="scale-inner" style="width:375px;height:760px;transform:scale(0.57)">
                ${renderPhoneApp(true)}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDesktopTab() {
      return `
        <div class="sub-toolbar">
          <div class="sub-toolbar-group">
            <div class="seg">
              <button class="seg-btn ${state.desktopOs === "macos" ? "active" : ""}" data-action="desktop-os" data-os="macos">macOS (红绿灯)</button>
              <button class="seg-btn ${state.desktopOs === "winlinux" ? "active" : ""}" data-action="desktop-os" data-os="winlinux">Windows / Linux</button>
            </div>
            <button class="studio-btn" data-action="toggle-desktop-sidebar">${state.desktopSidebarCollapsed ? "展开侧边栏 (232pt)" : "折叠为图标轨 (68pt)"}</button>
            <button class="studio-btn ${state.desktopNpOpen ? "primary" : ""}" data-action="${state.desktopNpOpen ? "close-desktop-np" : "open-desktop-np"}">${state.desktopNpOpen ? "收起 Now Playing" : "展开 Now Playing 舞台"}</button>
          </div>
          <div class="sub-toolbar-group">
            <span class="hint-pill">💡 可点击左侧音源切换器、搜索框、曲目行 ⋯ 菜单、进度条和左下角封面</span>
          </div>
        </div>
        ${renderDesktopApp(false)}
      `;
    }

    function renderStudioHeader() {
      const tabs = [
        { id: "overview", label: "全景三态对比" },
        { id: "desktop", label: "PC 桌面端" },
        { id: "pad", label: "Pad 平板端" },
        { id: "phone", label: "Phone 手机端 (OHOS/iOS)" },
        { id: "nowplaying", label: "Now Playing 舞台" },
        { id: "system", label: "规范 · 插件 · 音频架构" }
      ];
      document.getElementById("studio-tabs").innerHTML = tabs.map(t => `
        <button class="studio-tab ${state.studioTab === t.id ? "active" : ""}" data-action="studio-tab" data-tab="${t.id}">${t.label}</button>
      `).join("");

      const btnTheme = document.getElementById("btn-theme");
      btnTheme.innerHTML = state.theme === "light" ? `${ICONS.moon}<span>深色模式</span>` : `${ICONS.sun}<span>浅色模式</span>`;

      const btnPlay = document.getElementById("btn-play-sim");
      btnPlay.className = `studio-btn ${state.playing ? "primary" : ""}`;
      btnPlay.innerHTML = state.playing ? `${ICONS.pause}<span>暂停模拟</span>` : `${ICONS.play}<span>播放模拟</span>`;

      const btnRM = document.getElementById("btn-reduce-motion");
      btnRM.className = `studio-btn ${state.reduceMotion ? "active-pill" : ""}`;
      btnRM.textContent = state.reduceMotion ? "已开启减弱动态" : "减弱动态: 关";
    }

    function updatePlaybackTicks() {
      const tr = currentTrack();
      const pct = Math.min(100, Math.max(0, (state.positionSec / tr.duration) * 100));
      document.querySelectorAll(".js-pb-fill").forEach(el => { el.style.width = `${pct}%`; });
      document.querySelectorAll(".js-np-bar-fill").forEach(el => { el.style.width = `${pct}%`; });
      document.querySelectorAll(".js-pos-label").forEach(el => { el.textContent = fmtTime(state.positionSec); });

      // Update live lyric line highlight without resetting scroll/focus
      const lyrIdx = activeLyricIndex(tr, state.positionSec);
      const lyrWrap = document.getElementById("np-lyrics-scroll");
      if (lyrWrap) {
        const lines = lyrWrap.querySelectorAll(".lyric-line");
        lines.forEach((lineEl, i) => {
          lineEl.classList.toggle("active", i === lyrIdx);
          const lineData = tr.lyrics[i];
          if (lineData && lineData.words) {
            const lineDur = Math.max(1, lineData.end - lineData.start);
            const frac = i === lyrIdx ? Math.min(1, Math.max(0, (state.positionSec - lineData.start) / lineDur)) : (i < lyrIdx ? 1 : 0);
            const sungCount = Math.ceil(frac * lineData.words.length);
            lineEl.querySelectorAll(".lyric-word").forEach((wEl, wi) => {
              wEl.classList.toggle("sung", wi < sungCount);
            });
          }
        });
      }
    }

    function render() {
      document.documentElement.setAttribute("data-theme", state.theme);
      document.documentElement.setAttribute("data-reduce-motion", String(state.reduceMotion));
      renderStudioHeader();

      const stage = document.getElementById("studio-stage");
      // Preserve search input focus if user is currently typing
      const activeInput = document.activeElement;
      const wasSearching = activeInput && activeInput.dataset && activeInput.dataset.action === "search-input";
      const cursorPos = wasSearching ? activeInput.selectionStart : null;

      if (state.studioTab === "overview") stage.innerHTML = renderOverview();
      else if (state.studioTab === "desktop") stage.innerHTML = renderDesktopTab();
      else if (state.studioTab === "pad") stage.innerHTML = renderPadTab();
      else if (state.studioTab === "phone") stage.innerHTML = renderPhoneTab();
      else if (state.studioTab === "nowplaying") stage.innerHTML = renderNowPlayingTab();
      else stage.innerHTML = renderSystemTab();

      if (wasSearching) {
        const nextInput = stage.querySelector('input[data-action="search-input"]');
        if (nextInput) {
          nextInput.focus();
          if (cursorPos !== null) nextInput.setSelectionRange(cursorPos, cursorPos);
        }
      }
    }

    // Top studio controls
    document.getElementById("btn-theme").addEventListener("click", () => {
      state.theme = state.theme === "light" ? "dark" : "light";
      render();
    });
    document.getElementById("btn-play-sim").addEventListener("click", togglePlay);
    document.getElementById("btn-reduce-motion").addEventListener("click", () => {
      state.reduceMotion = !state.reduceMotion;
      render();
    });

    // Global delegated clicks
    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target) {
        if (state.desktopSourceMenuOpen || state.desktopVolOpen || state.desktopTrackMenuIdx !== null || state.padSourceMenuOpen) {
          state.desktopSourceMenuOpen = false;
          state.desktopVolOpen = false;
          state.desktopTrackMenuIdx = null;
          state.padSourceMenuOpen = false;
          render();
        }
        return;
      }

      const act = target.dataset.action;
      if (act === "studio-tab") {
        state.studioTab = target.dataset.tab;
        render();
      } else if (act === "play-track") {
        state.phoneSheet = null;
        state.desktopTrackMenuIdx = null;
        playTrack(Number(target.dataset.idx));
      } else if (act === "toggle-play") {
        e.stopPropagation();
        togglePlay();
      } else if (act === "prev-track") {
        e.stopPropagation();
        stepTrack(-1);
      } else if (act === "next-track") {
        e.stopPropagation();
        stepTrack(1);
      } else if (act === "toggle-like") {
        toggleLike(target.dataset.id, e);
      } else if (act === "toggle-shuffle") {
        state.shuffle = !state.shuffle;
        render();
      } else if (act === "cycle-repeat") {
        const order = ["off", "all", "one"];
        state.repeat = order[(order.indexOf(state.repeat) + 1) % order.length];
        render();
      } else if (act === "seek-sec") {
        state.positionSec = Number(target.dataset.sec);
        state.playing = true;
        render();
      } else if (act === "seek-bar") {
        const rect = target.getBoundingClientRect();
        const frac = (e.clientX - rect.left) / Math.max(1, rect.width);
        seekFrac(frac);
      } else if (act === "vol-bar") {
        const rect = target.getBoundingClientRect();
        state.volume = Math.min(1, Math.max(0, (e.clientX - rect.left) / Math.max(1, rect.width)));
        state.muted = state.volume === 0;
        render();
      } else if (act === "desktop-os") {
        state.desktopOs = target.dataset.os;
        render();
      } else if (act === "toggle-desktop-sidebar") {
        state.desktopSidebarCollapsed = !state.desktopSidebarCollapsed;
        render();
      } else if (act === "desktop-nav") {
        state.desktopPage = target.dataset.page;
        state.desktopSourceMenuOpen = false;
        render();
      } else if (act === "settings-tab") {
        state.desktopSettingsTab = target.dataset.tab;
        render();
      } else if (act === "toggle-desktop-source-menu") {
        e.stopPropagation();
        state.desktopSourceMenuOpen = !state.desktopSourceMenuOpen;
        render();
      } else if (act === "switch-source") {
        state.activeSourceId = target.dataset.src;
        state.desktopSourceMenuOpen = false;
        state.padSourceMenuOpen = false;
        state.phoneSheet = null;
        state.phoneCustomNav = "home";
        render();
      } else if (act === "open-desktop-np") {
        state.desktopNpOpen = true;
        state.desktopTrackMenuIdx = null;
        render();
      } else if (act === "close-desktop-np") {
        state.desktopNpOpen = false;
        render();
      } else if (act === "toggle-desktop-queue") {
        state.desktopQueueOpen = !state.desktopQueueOpen;
        render();
      } else if (act === "toggle-desktop-vol") {
        e.stopPropagation();
        state.desktopVolOpen = !state.desktopVolOpen;
        render();
      } else if (act === "open-track-menu") {
        e.stopPropagation();
        const idx = Number(target.dataset.idx);
        state.desktopTrackMenuIdx = state.desktopTrackMenuIdx === idx ? null : idx;
        render();
      } else if (act === "close-menus") {
        state.desktopTrackMenuIdx = null;
        render();
      } else if (act === "toggle-install-modal") {
        state.desktopInstallModal = !state.desktopInstallModal;
        render();
      } else if (act === "pad-orient") {
        state.padOrientation = target.dataset.orient;
        state.padDrawerOpen = false;
        render();
      } else if (act === "toggle-pad-rail") {
        state.padRailExpanded = !state.padRailExpanded;
        render();
      } else if (act === "pad-nav") {
        state.padPage = target.dataset.page;
        state.padDrawerOpen = false;
        render();
      } else if (act === "toggle-pad-drawer") {
        state.padDrawerOpen = !state.padDrawerOpen;
        render();
      } else if (act === "close-pad-drawer") {
        state.padDrawerOpen = false;
        render();
      } else if (act === "toggle-pad-source") {
        e.stopPropagation();
        state.padSourceMenuOpen = !state.padSourceMenuOpen;
        render();
      } else if (act === "open-pad-np") {
        state.padNpOpen = true;
        render();
      } else if (act === "close-pad-np") {
        state.padNpOpen = false;
        render();
      } else if (act === "phone-os") {
        state.phoneOs = target.dataset.os;
        render();
      } else if (act === "phone-tab") {
        state.phoneTab = target.dataset.tab;
        state.phoneNpOpen = false;
        render();
      } else if (act === "phone-custom-nav") {
        state.phoneCustomNav = target.dataset.page;
        render();
      } else if (act === "open-phone-np") {
        state.phoneNpOpen = true;
        state.phoneSheet = null;
        render();
      } else if (act === "close-phone-np") {
        state.phoneNpOpen = false;
        render();
      } else if (act === "phone-np-mode") {
        state.phoneNpMode = target.dataset.mode;
        render();
      } else if (act === "phone-sheet") {
        e.stopPropagation();
        state.phoneSheet = target.dataset.sheet;
        render();
      } else if (act === "phone-track-menu") {
        e.stopPropagation();
        state.phoneSheetTrackIdx = Number(target.dataset.idx);
        state.phoneSheet = "trackMenu";
        render();
      } else if (act === "close-phone-sheet") {
        state.phoneSheet = null;
        render();
      } else if (act === "np-pane") {
        state.npPane = target.dataset.pane;
        render();
      } else if (act === "np-style") {
        state.npPlayerStyle = target.dataset.style;
        render();
      } else if (act === "cycle-player-style") {
        const styles = ["cover", "vinyl", "cassette"];
        state.npPlayerStyle = styles[(styles.indexOf(state.npPlayerStyle) + 1) % styles.length];
        render();
      } else if (act === "np-device") {
        state.npShowcaseDevice = target.dataset.device;
        render();
      } else if (act === "np-device-toggle") {
        state.npShowcaseDevice = state.npShowcaseDevice === "phone" ? "desktop" : "phone";
        render();
      } else if (act === "toggle-demo-switch") {
        state.demoSwitch = !state.demoSwitch;
        render();
      }
    });

    // Live search input
    document.addEventListener("input", (e) => {
      const target = e.target;
      if (target && target.dataset && target.dataset.action === "search-input") {
        state.searchQuery = target.value;
        if (target.dataset.target === "desktop" && state.desktopPage !== "search" && state.searchQuery.trim()) {
          state.desktopPage = "search";
        }
        render();
      }
    });

    // Global keyboard shortcuts (Cmd/Ctrl+F, Space)
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
        const searchInput = document.querySelector('input[data-action="search-input"]');
        if (searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      } else if (e.code === "Space" && document.activeElement?.tagName !== "INPUT") {
        e.preventDefault();
        togglePlay();
      } else if (e.key === "Escape") {
        state.desktopNpOpen = false;
        state.padNpOpen = false;
        state.phoneNpOpen = false;
        state.phoneSheet = null;
        state.desktopInstallModal = false;
        render();
      }
    });

    // Playback simulation loop (0.2s tick)
    setInterval(() => {
      if (!state.playing) return;
      const tr = currentTrack();
      state.positionSec += 0.2;
      if (state.positionSec >= tr.duration) {
        if (state.repeat === "one") state.positionSec = 0;
        else stepTrack(1);
        return;
      }
      updatePlaybackTicks();
      // If on full-screen stage visualizer, update line dynamically when crossing line boundary
      if (state.studioTab === "nowplaying" && ["stage-flow", "stage-steps", "stage-tilt"].includes(state.npPane)) {
        const prevIdx = activeLyricIndex(tr, state.positionSec - 0.2);
        const curIdx = activeLyricIndex(tr, state.positionSec);
        if (prevIdx !== curIdx) render();
      }
    }, 200);

    // Initial mount
    render();
  </script>
</body>
</html>
